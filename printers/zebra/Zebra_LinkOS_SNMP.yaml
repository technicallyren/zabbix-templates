                - 30m
          timeout: 4s
          tags:
            - tag: print
              value: darkness
          triggers:
            - uuid: 2cc8683bd9f844df9d4702cc6fa6b681
              expression: 'last(/Zebra Industrial Printer/zebra.darkness)>={$ZEBRA.DARKNESS.INFO}'
              name: 'Printhead darkness - Too High'
              priority: INFO
              description: 'High darkness is decreasing print-head live-span.'
              manual_close: 'YES'
        - uuid: 0fe4a99bfd7949e0a395457cdf80b0d1

          value_type: TEXT
          trends: '0'
          description: |
            For more informations:
            https://www.zebra.com/gb/en/software/printer-software/link-os.html
          inventory_link: OS
          preprocessing:
            - type: DISCARD_UNCHANGED
              parameters:
                - ''
          timeout: 4s
          tags:
            - tag: system
              value: firmware
            - tag: system
              value: info
        - uuid: 10f784e8764147dd8fafd93a4b7f24d9
          name: 'Head latch status'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10642.2.1.1.0]'
          key: zebra.head
          history: 1w
          trends: 800d
          valuemap:
            name: Latch
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 30m
          timeout: 4s
          tags:
            - tag: sensor
              value: latch
          triggers:
            - uuid: 913c8e6a15744e3f84afc1d97b02898e
              expression: 'last(/Zebra Industrial Printer/zebra.head)=2'
              name: 'Head latch - Open'
              priority: WARNING
              description: |
                The status of the printer head latch. 
                The head latch must be closed for printing.
              dependencies:
                - name: 'Paper Out'
                  expression: 'last(/Zebra Industrial Printer/zebra.paper.out)=2'
        - uuid: e52a863db37748bdb76082f73759ce5f
          name: 'Head open count'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10642.3.1.9.0]'
          key: zebra.head.latch
          delay: 15m
          trends: 800d
          description: 'Total number of times the printhead latch was opened (zbrOdometerLatchOpenCount), typically when loading media or ribbons.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 30m
          timeout: 4s
          tags:
            - tag: counter
              value: 'head latch'
        - uuid: 86cd958d462448caacd580e2de0a2933

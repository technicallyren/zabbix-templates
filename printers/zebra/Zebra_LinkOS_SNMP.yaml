zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 60f1dce8720d41eab748470cd7d4746e
      name: Printer/Thermal
  templates:
    - uuid: c9d9602c4f2544a6b85e23075210705f
      template: 'Zebra Industrial Printer'
      name: 'Zebra LinkOS - Template'
      description: |
        Template made for: Zebra ZD420 Industrial Printers.
        
        Tested on: Zabbix 7
        Based on MIB: Link-OS 7.7
        
        Written and tested by: Rene Holasek and Pavel Cervenicky.
        Documentation and final changes written by: Gemini AI.
      groups:
        - name: Printer/Thermal
        - name: Templates/Zebra
      items:
        - uuid: ffb4dd785b1049bd841847e53cd1f714
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          history: 2w
          trends: 800d
          valuemap:
            name: Ping
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 30m
          tags:
            - tag: icmp
              value: ping
          triggers:
            - uuid: 76c69428d2e4435bb0033c22a9a7327d
              expression: 'last(/Zebra Industrial Printer/icmpping,#1)=0'
              name: 'Unavailable by ICMP ping'
              priority: AVERAGE
        - uuid: 36db5eab112f4ba7bb794345f7bd7675
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          history: 2w
          value_type: FLOAT
          trends: 800d
          units: '%'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 30m
          tags:
            - tag: icmp
              value: loss
          triggers:
            - uuid: 55c933e6f7104d81a02568a58933246b
              expression: 'min(/Zebra Industrial Printer/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Zebra Industrial Printer/icmppingloss,5m)<100'
              name: 'High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'Unavailable by ICMP ping'
                  expression: 'last(/Zebra Industrial Printer/icmpping,#1)=0'
        - uuid: a996c6a1623f40bcbe2922ccce1448a4
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          history: 2w
          value_type: FLOAT
          trends: 800d
          units: s
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 30m
          tags:
            - tag: icmp
              value: response
          triggers:
            - uuid: 100ef4ec3340426087162ec1430098cf
              expression: 'avg(/Zebra Industrial Printer/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'High ICMP ping loss'
                  expression: 'min(/Zebra Industrial Printer/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Zebra Industrial Printer/icmppingloss,5m)<100'
                - name: 'Unavailable by ICMP ping'
                  expression: 'last(/Zebra Industrial Printer/icmpping,#1)=0'
        - uuid: 5b8ee3f2195d4aaebe17c6e35bc92a11
          name: 'SNMP Enable'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10642.20.10.10.5.12.1.0]'
          key: snmp.enabled
          delay: 15m
          trends: '0'
          valuemap:
            name: Yes/No
          preprocessing:
            - type: DISCARD_UNCHANGED
              parameters:
                - ''
          tags:
            - tag: snmp
              value: settings
        - uuid: 7b21d441e4d04b78b7868f08f32e5187
          name: 'SNMP v3 Enable'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10642.20.10.10.5.17.1.0]'
          key: snmp.v3.enabled
          delay: 15m
          trends: '0'
          description: 'For security reasons.'
          valuemap:
            name: Yes/No
          preprocessing:
            - type: DISCARD_UNCHANGED
              parameters:
                - ''
          tags:
            - tag: snmp
              value: settings
        - uuid: 5a0cf5bf8248495aae323277b27610d8
          name: 'Bluetooth discoverable'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10642.20.3.3.0]'
          key: zebra.bluetooth
          delay: 15m
          history: 7d
          trends: '0'
          valuemap:
            name: ON/OFF
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          timeout: 4s
          tags:
            - tag: wireless
              value: bluetooth
        - uuid: cbc247661e05416da941ecb64067258e
          name: 'Bluetooth mac'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10642.20.3.11.0]'
          key: zebra.bluetooth.mac
          delay: 15m
          history: 7d
          value_type: TEXT
          trends: '0'
          inventory_link: MACADDRESS_B
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          timeout: 4s
          tags:
            - tag: wireless
              value: bluetooth
        - uuid: 84fb8814e38945ac815e59ef3bffe063
          name: 'Bluetooth name'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10642.20.3.5.0]'
          key: zebra.bluetooth.name
          delay: 15m
          history: 7d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          timeout: 4s
          tags:
            - tag: wireless
              value: bluetooth
        - uuid: 39a6efba3be1423d84043ef5f7f15cb4
          name: 'Print Buffer Error'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10642.6.18.0]'
          key: zebra.buffer.error
          history: 7d
          trends: 800d
          valuemap:
            name: Memory
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          timeout: 4s
          tags:
            - tag: memory
              value: error
          triggers:
            - uuid: a54af34b00a04cce9f7915e6f1d28858
              expression: 'last(/Zebra Industrial Printer/zebra.buffer.error)=2'
              name: 'Print Buffer Full Error'
              priority: WARNING
        - uuid: be15dd63501f424f9e36be782f0932a3
          name: 'Cache Memory Error'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10642.6.15.0]'
          key: zebra.cache
          history: 7d
          trends: 800d
          valuemap:
            name: Memory
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 30m
          timeout: 4s
          tags:
            - tag: memory
              value: error
          triggers:
            - uuid: 7c43526ea2bd4ec89763c9d4c03abd95
              expression: 'last(/Zebra Industrial Printer/zebra.cache)=2'
              name: 'Cache Memory Error'
        - uuid: 0399d7059b9f41f780beeddd65a126e4
          name: 'Head close action'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10642.2.10.4.5.0]'
          key: zebra.close.action
          trends: '0'
          valuemap:
            name: 'Head actions'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          timeout: 4s
          tags:
            - tag: system
              value: config
        - uuid: bb516f83b5714a94a5c2a212ffb9ed7f
          name: 'Total cuts'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10642.3.1.16.0]'
          key: zebra.cuts
          delay: 15m
          trends: 800d
          units: '!cuts'
          description: |
            Total non-resettable cuts counter over the lifetime of the printer (zbrOdometerTotalCuts).
            
            Used for predictive blade maintenance.
            IPA is ok.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 15m
          timeout: 4s
          tags:
            - tag: counter
              value: cutter
        - uuid: 706f0ad731e442ff9a23810e8b28b153
          name: 'Total cuts reset'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10642.3.1.17.0]'
          key: zebra.cuts.reset
          delay: 15m
          trends: 800d
          units: '!cuts'
          description: |
            User-resettable cut counter.
            Reset to 0 after replacing or servicing the cutter blade.
            (zbrOdometerTotalCuts)
            
            Used for predictive blade maintenance.
            IPA is ok.
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 15m
          timeout: 4s
          tags:
            - tag: counter
              value: cutter
          triggers:
            - uuid: 174f1d329f2e4256a073aae000867e1d
              expression: 'last(/Zebra Industrial Printer/zebra.cuts.reset)>={$ZEBRA.CUTS.MAX.WARN}'
              name: 'Cutter requires increased attention'
              priority: INFO
              description: 'Cutter exceeded recommended service interval.'
              tags:
                - tag: Cutter
                  value: warning
        - uuid: 143f9a041ce1469880ad01ae53c52ccf
          name: 'Media darkness'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10642.6.2.0]'
          key: zebra.darkness
          delay: 5m
          history: 7d
          trends: 800d
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT

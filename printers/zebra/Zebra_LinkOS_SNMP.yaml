          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          timeout: 4s
          tags:
            - tag: system
              value: info
        - uuid: 4651a066b04943b69b6f931c46a75c20
          name: Errors
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.10642.5.1.24.0]'
          key: zebra.error

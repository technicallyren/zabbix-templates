zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 18c35b08ccba4e34aa5cf342eff74601
      name: Printer/Toner
  templates:
    - uuid: 27e4467cfd7d47c0a2629a9d1b200148
      template: Canon_printer_SNMP
      name: Canon_printer_SNMP
      description: |
        Basic template for canon printers with discovery function.
        Made for: iR-ADV C5840
        
        
        Created by Rene Holasek.
        Documentation and final changes: Gemini AI.
      groups:
        - name: Printer/Toner
      items:
        - uuid: db069b7607bb4adfadaf501cab9925b8
          name: Model
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.43.5.1.1.16.1]'
          key: canon.model
          delay: 1h
          history: 7d
          value_type: TEXT
          trends: '0'
          inventory_link: MODEL
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: system
              value: info
        - uuid: 36fe52d2e8664bafb8e2009a6b752225
          name: Name
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.5.0]'
          key: canon.name
          delay: 1h
          history: 7d
          value_type: TEXT
          trends: '0'
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: system
              value: info
        - uuid: 8a608520c3e24aaa956cd8dc56ab0839
          name: Serial_number
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.43.5.1.1.17.1]'
          key: canon.sn
          delay: 1h
          history: 7d
          value_type: TEXT
          trends: '0'
          inventory_link: SERIALNO_A
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: system
              value: info
        - uuid: 82475cc151824893a6f51a33b46fff0a
          name: Papers_sensor
          type: CALCULATED
          key: canon.tray.total
          value_type: FLOAT
          params: 'min(last_foreach(//canon.tray.sensor.[*]))=1 and max(last_foreach(//canon.tray.sensor.[*]))=1'
          tags:
            - tag: component
              value: tray
            - tag: supply
              value: paper
          triggers:
            - uuid: a23e19856f7c4e009ba27e5596875648
              expression: last(/Canon_printer_SNMP/canon.tray.total)=1
              name: 'Paper empty'
              priority: WARNING
              description: 'Count all drawers.'
        - uuid: 8a1925fa9e6940af85c72e7b6f6ef0dd
          name: Uptime
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.25.1.1.0]'
          key: canon.uptime
          delay: 3m
          trends: 800d
          units: s
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: system
              value: uptime
          triggers:
            - uuid: 2649aea294f34a70b01cfaabc5a459d9
              expression: last(/Canon_printer_SNMP/canon.uptime)<300
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: last(/Canon_printer_SNMP/canon.uptime)>300
              name: 'Printer restarted'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: printer
                  value: restart
        - uuid: dcbb7114764f4041979122e40ee287d3
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          history: 7d
          trends: 800d
          valuemap:
            name: Ping
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 5m
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: d3c54bc976fa43b1b705ec1ee39fa554
              expression: last(/Canon_printer_SNMP/icmpping)=0
              name: 'Printer is unavailable'
              priority: HIGH
        - uuid: b1d5f05a7fc74a4da8e619c67bb0b209
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          history: 7d
          value_type: FLOAT
          trends: 800d
          units: '%'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 5m
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
        - uuid: 571685191d82475f864016804294d17e
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          history: 7d
          value_type: FLOAT
          trends: 800d
          units: s
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 5m
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
      discovery_rules:
        - uuid: 325040c880b44e838abd162583827736
          name: Counter
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.4.1.1602.1.11.1.3.1.3]'
          key: 'canon.counter[{#SNMPINDEX}]'
          delay: 24h
          lifetime: 14d
          item_prototypes:
            - uuid: e1cfcd0881534db0871fa73d84cc9ace
              name: 'Counter {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1602.1.11.1.3.1.4.{#SNMPINDEX}]'
              key: 'canon.supply.counter[{#SNMPINDEX}]'
              delay: 10m
              trends: 800d
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              tags:
                - tag: component
                  value: counter
                - tag: Counter
                  value: '{#IFNAME}'
        - uuid: a9eaeaa74ea4449db178e7d5ed40aadf
          name: Door
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.43.6.1.1.2.1,{#IFSTATUS},1.3.6.1.2.1.43.6.1.1.3.1]'
          key: 'canon.door[{#SNMPINDEX}]'
          delay: 24h
          lifetime: 14d
          item_prototypes:
            - uuid: e1adf1671cd1465db70f002237bcb268
              name: '{#IFNAME}'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.43.6.1.1.3.1.{#SNMPINDEX}]'
              key: 'canon.door.[{#SNMPINDEX}]'
              value_type: FLOAT
              valuemap:
                name: Door
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              tags:
                - tag: component
                  value: door
              trigger_prototypes:
                - uuid: a343015ed1f64d54be0ca8d93fb85f88
                  expression: 'last(/Canon_printer_SNMP/canon.door.[{#SNMPINDEX}])<>4 and last(/Canon_printer_SNMP/canon.door.[{#SNMPINDEX}])<>6'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Canon_printer_SNMP/canon.door.[{#SNMPINDEX}])=4 or last(/Canon_printer_SNMP/canon.door.[{#SNMPINDEX}])=6'
                  name: 'Door is not in closed state'
                  event_name: 'Door: {#IFNAME}'
                  priority: INFO
                  manual_close: 'YES'
        - uuid: c671ad4046134696969300d87a7562aa
          name: NIC
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2,{#IFADD},1.3.6.1.2.1.2.2.1.6,{#IFSTAT},1.3.6.1.2.1.2.2.1.8]'
          key: 'canon.int[{#SNMPINDEX}]'
          delay: 24h
          filter:
            conditions:
              - macro: '{#IFNAME}'
                value: '(?i)^(lo|dummy|Loopback|dummy0)$'
                operator: NOT_MATCHES_REGEX
                formulaid: A
              - macro: '{#IFSTAT}'
                value: '(?i)^(2)$'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          lifetime: 14d
          item_prototypes:
            - uuid: de3a5b2dcecc4fffbcb9eb1b338e5007
              name: 'Discarded: {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]'
              key: 'canon.int.discard.[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              trends: 800d
              units: B
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              tags:
                - tag: component
                  value: interface
                - tag: mac
                  value: '{#IFADD}'
            - uuid: cbb19b9d26014a38a79a30bc613c56a7
              name: 'In: {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]'
              key: 'canon.int.in.[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              trends: 800d
              units: B
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
                - tag: mac
                  value: '{#IFADD}'
              trigger_prototypes:
                - uuid: 77b53f43c72d443cbe50dd02da455ac7
                  expression: 'last(/Canon_printer_SNMP/canon.int.in.[{#SNMPINDEX}])>{$CANON.NET.DATA.WARN}'
                  name: 'Printer restart attention.'
                  priority: INFO
                  description: |
                    If all prints are send in PDF, I assume that somewhere in printer memory are all prints stored, there is a high possibility that printer will stuck or print white paper if this value is exceeded.
                    
                    Restart is recommended.
                    Issue discovered on: iR-ADV C5840 might be different on your model/FW.
            - uuid: 30afa56dd29242819e33149521ace740
              name: 'Out: {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]'
              key: 'canon.int.out.[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              trends: 800d
              units: B
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
                - tag: mac
                  value: '{#IFADD}'
            - uuid: fa3e7a671c354798831609b3e00642c2
              name: 'Status: {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]'
              key: 'canon.int.status.[{#SNMPINDEX}]'
              delay: 5m
              history: 7d
              valuemap:
                name: Interface
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
                - tag: mac
                  value: '{#IFADD}'
        - uuid: 8e836b954b0147bcacf4f6bee2afdccb
          name: Multi_tray
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.43.8.2.1.13.1,{#IFMAX},1.3.6.1.2.1.43.8.2.1.9.1]'
          key: 'canon.multi.tray[{#SNMPINDEX}]'
          delay: '24h;8h/1-6,5:00-22:00'
          filter:
            conditions:
              - macro: '{#IFNAME}'
                value: '(?i)multi.*'
                formulaid: A
          lifetime: 14d
          item_prototypes:
            - uuid: a0411affc7e6465c8b81b7a44b97a0a3
              name: '{#IFNAME}'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.43.8.2.1.10.1.{#SNMPINDEX}]'
              key: 'canon.multi.tray.[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: '!papers'
              tags:
                - tag: component
                  value: tray
            - uuid: 038b085ec8e747dfb18b6cc8a2c690d0
              name: '{#IFNAME} type:'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1602.1.4.64.1.1.10.1.{#SNMPINDEX}]'
              key: 'canon.multi.type[{#SNMPINDEX}]'
              delay: 5m
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
              tags:
                - tag: component
                  value: tray
                - tag: supply
                  value: paper
        - uuid: 5b7170767a514a5dbde8697b64389472
          name: Toner
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.43.12.1.1.4.1,{#IFTYPE},1.3.6.1.2.1.43.11.1.1.6.1,{#IFMODEL},1.3.6.1.2.1.43.5.1.1.16]'
          key: 'canon.toner[{#SNMPINDEX}]'
          delay: '24h;8h/1-6,5:00-22:00'
          filter:
            conditions:
              - macro: '{#IFNAME}'
                value: '(?i)(Black|Cyan|Magenta|Yellow)'
                formulaid: A
          lifetime: 14d
          item_prototypes:
            - uuid: b0b4d85aa2954360bf2a7e7e5a9a5c98
              name: 'Color: {#IFNAME}'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.43.11.1.1.9.1.{#SNMPINDEX}]'
              key: 'canon.supply.toner[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              trends: 700d
              units: '%'
              valuemap:
                name: 'Printer Supply State'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: supply
                  value: '{#IFTYPE}'
              trigger_prototypes:
                - uuid: f2310805023e472bb0cb217581050ac4
                  expression: 'last(/Canon_printer_SNMP/canon.supply.toner[{#SNMPINDEX}])>=0 and last(/Canon_printer_SNMP/canon.supply.toner[{#SNMPINDEX}])<={$TONEREMPTY}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Canon_printer_SNMP/canon.supply.toner[{#SNMPINDEX}])>{$TONERINFO}'
                  name: 'Toner empty {#IFTYPE}, Level: {ITEM.LASTVALUE}'
                  priority: HIGH
                  tags:
                    - tag: toner
                      value: empty
                - uuid: 4df1d9327a114d54b6087dd35dedf1f2
                  expression: 'last(/Canon_printer_SNMP/canon.supply.toner[{#SNMPINDEX}])>=0 and last(/Canon_printer_SNMP/canon.supply.toner[{#SNMPINDEX}])<{$TONERINFO}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Canon_printer_SNMP/canon.supply.toner[{#SNMPINDEX}])>{$TONERINFO}'
                  name: 'Toner info {#IFTYPE}, level: {ITEM.LASTVALUE}'
                  priority: INFO
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Toner empty {#IFTYPE}, Level: {ITEM.LASTVALUE}'
                      expression: 'last(/Canon_printer_SNMP/canon.supply.toner[{#SNMPINDEX}])>=0 and last(/Canon_printer_SNMP/canon.supply.toner[{#SNMPINDEX}])<={$TONEREMPTY}'
                      recovery_expression: 'last(/Canon_printer_SNMP/canon.supply.toner[{#SNMPINDEX}])>{$TONERINFO}'
                  tags:
                    - tag: toner
                      value: low
          graph_prototypes:
            - uuid: 038bb3ecfacc4dd586589dd3193605e1
              name: Toner
              ymin_type_1: FIXED
              ymax_type_1: FIXED
              graph_items:
                - color: 1A7C11
                  calc_fnc: ALL
                  item:
                    host: Canon_printer_SNMP
                    key: 'canon.supply.toner[{#SNMPINDEX}]'
        - uuid: 9b8da8fc71584d58b4dcf4ee1ef80354
          name: Tray
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.43.8.2.1.13.1,{#IFMAX},1.3.6.1.2.1.43.8.2.1.9.1]'
          key: 'canon.tray[{#SNMPINDEX}]'
          delay: '24h;8h/1-6,5:00-22:00'
          filter:
            conditions:
              - macro: '{#IFNAME}'
                value: '(?i)multi.*'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          lifetime: 14d
          item_prototypes:
            - uuid: 3eefdc31400a48faa75697162a490d3f
              name: '{#IFNAME} height'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.43.8.2.1.4.1.{#SNMPINDEX}]'
              key: 'canon.tray.height.[{#SNMPINDEX}]'
              delay: 10m
              history: 7d
              value_type: FLOAT
              units: '!cm'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
                - type: MULTIPLIER
                  parameters:
                    - '0.0001'
              tags:
                - tag: component
                  value: tray
                - tag: supply
                  value: paper
            - uuid: c2b1f24cdeb14fb3964bd899345ec53c
              name: '{#IFNAME} remaining paper'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.43.8.2.1.10.1.{#SNMPINDEX}]'
              key: 'canon.tray.remaining.[{#SNMPINDEX}]'
              delay: 10m
              value_type: FLOAT
              units: '!papers'
              valuemap:
                name: 'Printer Supply State'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              tags:
                - tag: capacity
                  value: '{#IFMAX}'
                - tag: component
                  value: tray
                - tag: supply
                  value: paper
              trigger_prototypes:
                - uuid: 29031b8d8d87465d880c4b7426000043
                  expression: 'last(/Canon_printer_SNMP/canon.tray.remaining.[{#SNMPINDEX}])>=0 and last(/Canon_printer_SNMP/canon.tray.remaining.[{#SNMPINDEX}])<={$PAPERINFO}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Canon_printer_SNMP/canon.tray.remaining.[{#SNMPINDEX}])>{$PAPERINFO}'
                  name: 'Paper level info'
                  event_name: '{#IFNAME}: Small amount of papers.'
                  priority: INFO
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Paper empty'
                      expression: last(/Canon_printer_SNMP/canon.tray.total)=1
            - uuid: b74533ce5a164ccda3d5c88b292484ce
              name: '{#IFNAME}'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.43.8.2.1.11.1.{#SNMPINDEX}]'
              key: 'canon.tray.sensor.[{#SNMPINDEX}]'
              delay: 10m
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              tags:
                - tag: capacity
                  value: '{#IFMAX}'
                - tag: component
                  value: tray
                - tag: supply
                  value: paper
            - uuid: c05a2bc0febb44119c0c5f559874c21b
              name: '{#IFNAME} type'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.1602.1.4.64.1.1.10.1.{#SNMPINDEX}]'
              key: 'canon.tray.type[{#SNMPINDEX}]'
              delay: 10m
              history: 7d
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
              tags:
                - tag: capacity
                  value: '{#IFMAX}'
                - tag: component
                  value: tray
                - tag: supply
                  value: paper
            - uuid: 7dcb1af284f34a41919431d48ec26978
              name: '{#IFNAME} width'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.43.8.2.1.5.1.{#SNMPINDEX}]'
              key: 'canon.tray.width.[{#SNMPINDEX}]'
              delay: 10m
              history: 7d
              value_type: FLOAT
              units: '!cm'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
                - type: MULTIPLIER
                  parameters:
                    - '0.0001'
              tags:
                - tag: component
                  value: tray
                - tag: supply
                  value: paper
        - uuid: 28c58f1b140948848b0890e0e1165da4
          name: Unit
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.43.11.1.1.6.1]'
          key: 'canon.unit[{#SNMPINDEX}]'
          delay: '24h;8h/1-6,5:00-22:00'
          filter:
            conditions:
              - macro: '{#IFNAME}'
                value: '(?i)(Unit)'
                formulaid: A
          lifetime: 14d
          item_prototypes:
            - uuid: 21913b5273d84e6fac5aa708d76315c4
              name: '{#IFNAME}'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.43.11.1.1.9.1.{#SNMPINDEX}]'
              key: 'canon.supply.unit[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              trends: 700d
              units: '%'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              tags:
                - tag: supply
                  value: unit
        - uuid: 43f4cd8b3af34a4fadafff7a508373b6
          name: Waste
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.43.11.1.1.6.1,{#IFTYPE},1.3.6.1.2.1.43.11.1.1.6.1]'
          key: 'canon.waste[{#SNMPINDEX}]'
          delay: '24h;8h/1-6,5:00-22:00'
          filter:
            conditions:
              - macro: '{#IFNAME}'
                value: '(?i)(Waste)\s+'
                formulaid: A
          lifetime: 14d
          item_prototypes:
            - uuid: 42889e8872a84e90a1bad738c920fe8b
              name: '{#IFNAME}'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.43.11.1.1.9.1.{#SNMPINDEX}]'
              key: 'canon.supply.waste[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              trends: 700d
              units: '%'
              valuemap:
                name: 'Printer Supply State'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              tags:
                - tag: supply
                  value: waste
                - tag: supply
                  value: '{#IFTYPE}'
              trigger_prototypes:
                - uuid: 4556687d9f0841ee9b8cf4a8c2856382
